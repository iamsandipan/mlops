# GPU nodes for kubernetes/gpu workloads. Karpenter launches one when a pod
# requests nvidia.com/gpu and tolerates the taint below; the default pool has no
# GPU instance types, so it never picks those pods up.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      # Keeps non-GPU pods off expensive GPU nodes
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # g5: A10G 24GB, g6: L4 24GB, g6e: L40S 48GB. Add p4d (A100) or p5 (H100)
        # for large training jobs; they usually need a capacity reservation.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5", "g6", "g6e"]
      expireAfter: 720h
  limits:
    # Caps spend: at most 16 GPUs across all nodes in this pool
    nvidia.com/gpu: "16"
  disruption:
    # Only remove nodes that are empty; consolidating busy GPU nodes would kill
    # inference pods and restart model loading. Idle nodes go after 5 minutes.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: "KarpenterNodeRole-<CLUSTER_NAME>"
  # For GPU instance types the al2023 alias resolves to the NVIDIA AMI, which ships
  # the driver and container toolkit (kubernetes/gpu/operator relies on this)
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<CLUSTER_NAME>"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<CLUSTER_NAME>"
  # CUDA and ML framework images are often 10-20 GB each
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
