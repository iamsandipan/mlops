image:
  repository: prom/prometheus
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

# Data retention for the TSDB
retention: 15d

serviceAccount:
  create: true
  name: ""

# Grants read access to nodes, pods, services, endpoints, ingresses for service discovery
rbac:
  create: true

service:
  type: ClusterIP
  port: 9090

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""  # empty uses the cluster default
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

securityContext:
  runAsUser: 65534
  runAsGroup: 65534
  runAsNonRoot: true
  fsGroup: 65534

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus configuration (prometheus.yml)
config:
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
  rule_files:
    - /etc/prometheus/rules.yml
  scrape_configs:
    - job_name: prometheus
      static_configs:
        - targets: ["localhost:9090"]

    - job_name: kubernetes-apiservers
      kubernetes_sd_configs:
        - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      authorization:
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

    - job_name: kubernetes-nodes
      kubernetes_sd_configs:
        - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      authorization:
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    - job_name: kubernetes-cadvisor
      kubernetes_sd_configs:
        - role: node
      scheme: https
      metrics_path: /metrics/cadvisor
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      authorization:
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    # Scrapes pods annotated with prometheus.io/scrape: "true"
    # (optional: prometheus.io/path, prometheus.io/port, prometheus.io/scheme)
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
          action: replace
          target_label: __scheme__
          regex: (https?)
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: (.+);(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod

    # GPU metrics from the DCGM exporter in kubernetes/gpu/operator, one target per
    # GPU node (DCGM_FI_DEV_GPU_UTIL, DCGM_FI_DEV_FB_USED, ...)
    - job_name: nvidia-dcgm-exporter
      kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [gpu-operator]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          action: keep
          regex: nvidia-dcgm-exporter
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node

# Alerting/recording rules (rules.yml)
rules:
  groups: []
