apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "secret-rotation.storeName" . }}
  labels:
    {{- include "secret-rotation.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      {{- with .Values.store.serviceAccount }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ . }}
      {{- end }}
