{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "secret-rotation.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default $.Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "secret-rotation.storeName" $ }}
  target:
    name: {{ .name }}
    # Deleting the ExternalSecret deletes the Kubernetes Secret too
    creationPolicy: Owner
  {{- if .data }}
  data:
    {{- toYaml .data | nindent 4 }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ required (printf "secrets[%s]: set remoteKey or data" .name) .remoteKey }}
  {{- end }}
{{- end }}
