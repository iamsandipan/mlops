{{- if eq .Values.kind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-workload.fullname" . }}
  labels:
    {{- include "gpu-workload.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "gpu-workload.selectorLabels" . | nindent 6 }}
  template:
    {{- include "gpu-workload.podTemplate" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu-workload.fullname" . }}
  labels:
    {{- include "gpu-workload.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gpu-workload.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.deployment.port }}
      targetPort: http
{{- end }}
