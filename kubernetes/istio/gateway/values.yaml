# Values for the upstream istio/gateway chart
gateway:
  # Pods get labels app=istio-ingressgateway, istio=ingressgateway; select them
  # from Gateway resources with `selector: {istio: ingressgateway}`
  name: istio-ingressgateway

  service:
    type: LoadBalancer
    annotations:
      # Internet-facing NLB, created by the cloud controller EKS runs. With the
      # AWS Load Balancer Controller installed, use "external" plus
      # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip instead.
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    minAvailable: 1

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          istio: ingressgateway

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi
