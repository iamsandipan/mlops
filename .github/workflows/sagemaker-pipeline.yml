name: SageMaker Pipeline

on:
  push:
    branches: [master]
    paths:
      - "pipeline/**"
      - ".github/workflows/sagemaker-pipeline.yml"
  workflow_dispatch:
    inputs:
      start:
        description: Start an execution after updating the pipeline definition
        type: boolean
        default: true
      wait:
        description: Wait for the execution to finish (fails the job if the pipeline fails)
        type: boolean
        default: true

permissions:
  id-token: write # required to request the OIDC token exchanged with STS
  contents: read

concurrency:
  group: sagemaker-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Get STS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-sagemaker-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upsert and run pipeline
        shell: bash
        env:
          SAGEMAKER_ROLE_ARN: ${{ vars.SAGEMAKER_ROLE_ARN }}
          SAGEMAKER_BUCKET: ${{ vars.SAGEMAKER_BUCKET }}
          # Pushes start and wait; manual runs use the chosen inputs.
          START: ${{ github.event_name == 'push' || inputs.start }}
          WAIT: ${{ github.event_name == 'push' || inputs.wait }}
        run: |
          set -euo pipefail
          args=()
          [ "$START" = "true" ] || args+=(--no-start)
          [ "$WAIT" = "true" ] && args+=(--wait)
          python pipeline/pipeline.py "${args[@]}"
